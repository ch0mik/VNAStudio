name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          Import-Module ./scripts/ReleaseTools.psm1 -Force
          $version = Get-VnaReleaseVersion -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT

  build:
    name: v${{ needs.validate.outputs.version }} / ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            runner: windows-2022
          - rid: win-x64
            runner: windows-2022
          - rid: win-arm64
            runner: windows-2022
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04
          - rid: linux-musl-x64
            runner: ubuntu-24.04
          - rid: linux-musl-arm
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            runner: ubuntu-24.04
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check release scripts
        run: ./tests/release/Release.Tests.ps1
      - name: Test application on the runner
        run: |
          dotnet test Vna.slnx --configuration Release --nologo -p:UsedAvaloniaProducts=
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed.' }
      - name: Publish and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_RID: ${{ matrix.rid }}
        run: ./scripts/Publish-Release.ps1 -Tag $env:RELEASE_TAG -Rid $env:TARGET_RID
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: .artifacts/release/packages/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          include-hidden-files: true
          retention-days: 7

  upload:
    name: Attach all packages to release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .artifacts/release/packages
          merge-multiple: true
      - name: Verify and upload release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Import-Module ./scripts/ReleaseTools.psm1 -Force
          $assets = @(Get-VnaReleaseAssets -Tag $env:RELEASE_TAG -Directory .artifacts/release/packages)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
